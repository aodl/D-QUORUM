[package]
name = "dendrite-bootstrap"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candid.workspace = true
serde.workspace = true
sha2.workspace = true
ic-cdk.workspace = true
ic-clients = { version = "=0.1.0", path = "../../crates/ic-clients" }
dendrite-types = { version = "=0.1.0", path = "../../crates/dendrite-types" }

[[example]]
name = "bootstrap-interface"
path = "examples/interface.rs"

[[example]]
name = "bootstrap-policy"
path = "examples/policy.rs"

[[example]]
name = "bootstrap-plan-digest"
path = "examples/plan_digest.rs"
