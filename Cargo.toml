[workspace]
resolver = "2"
members = ["canisters/d_quorum", "crates/policy", "crates/accounting", "crates/ic_clients", "vendor/dendrite/crates/dendrite-types", "tests/mocks", "tests/pocketic", "tools/xtask"]
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
rust-version = "1.94.1"
[workspace.dependencies]
candid = "=0.10.24"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
ic-cdk = "=0.20.2"
ic-cdk-timers = "=1.0.0"
ic-stable-structures = "=0.7.2"
sha2 = "=0.10.9"
hex = "=0.4.3"
proptest = "=1.10.0"
pocket-ic = "=15.0.0"
dendrite-types = { path = "vendor/dendrite/crates/dendrite-types" }
quorum-policy = { path = "crates/policy" }
quorum-accounting = { path = "crates/accounting" }
quorum-ic-clients = { path = "crates/ic_clients" }
d-quorum = { path = "canisters/d_quorum" }
[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = "symbols"
